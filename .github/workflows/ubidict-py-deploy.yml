name: ubidict-py Deploy

# main에 ubidict-py/ 변경이 들어가면: 이미지 빌드(arm64) → ECR push → deploy/
# 폴더를 S3에 업로드 → CodeDeploy(EC2/On-Premises, 단일 인스턴스
# lovebug-fastapi) 배포. `final-lovebug/final`(스프링 백엔드)의
# `.github/workflows/deploy.yml`+`deploy/appspec.yml`을 실제로 조회해
# 그대로 참고한 구조다 — 같은 계정, 같은 CodeDeploy 애플리케이션(`lovebug`)
# 아래 배포그룹만 다르다(`lovebug-fastapi-codedeploy`).
on:
  push:
    branches: [main]
    paths:
      - "ubidict-py/**"
      - ".github/workflows/ubidict-py-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-ubidict-py
  cancel-in-progress: false

permissions:
  id-token: write   # AWS OIDC — 장기 액세스 키를 시크릿에 안 둔다
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE: arn:aws:iam::416121583617:role/lovebug-github-actions
  BUCKET: lovebug-s3-416121583617-ap-northeast-2-an
  TAG: ${{ github.sha }}

jobs:
  build:
    # 타깃 인스턴스(lovebug-fastapi)가 t4g.micro(ARM64/Graviton)라 네이티브
    # ARM 러너에서 빌드한다 — 스프링과 동일한 이유로 동일한 러너를 쓴다.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ubidict-py
          platforms: linux/arm64
          push: true
          provenance: false
          # lovebug/fastapi는 imageTagMutability: IMMUTABLE이라 latest처럼
          # 재사용되는 태그를 push하면 두 번째 배포부터 실패한다 — sha 태그만 쓴다.
          tags: ${{ steps.ecr.outputs.registry }}/lovebug/fastapi:${{ env.TAG }}
          cache-from: type=gha,scope=ubidict-py
          cache-to: type=gha,mode=max,scope=ubidict-py

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload bundle
        run: |
          cd ubidict-py
          chmod +x deploy/scripts/*.sh
          echo "$TAG" > deploy/IMAGE_TAG
          cd deploy && zip -qr "$GITHUB_WORKSPACE/bundle.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -l bundle.zip
          aws s3 cp bundle.zip "s3://$BUCKET/lovebug/deploy/fastapi-$TAG.zip"

      - name: Deploy
        timeout-minutes: 30
        run: |
          ID=$(aws deploy create-deployment \
            --application-name lovebug \
            --deployment-group-name lovebug-fastapi-codedeploy \
            --description "$TAG" \
            --s3-location "bucket=$BUCKET,key=lovebug/deploy/fastapi-$TAG.zip,bundleType=zip" \
            --query deploymentId --output text)
          echo "deployment: $ID"

          aws deploy wait deployment-successful --deployment-id "$ID" || {
            aws deploy get-deployment --deployment-id "$ID" \
              --query 'deploymentInfo.{Status:status,Error:errorInformation}'
            exit 1
          }
