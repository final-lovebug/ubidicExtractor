name: ubidict-py CI

# 이 리포는 test/(R&D 프로토타입)와 ubidict-py/(프로덕션 FastAPI 서비스)가
# 같이 있는 모노레포다. test/는 CI 대상이 아니다(사람이 CLI로 직접 채점하는
# R&D 산출물 — ubidict-py/task.md·AGENTS.md 참고). ubidict-py/ 변경에만 반응한다.
on:
  push:
    branches: [main, develop]
    paths:
      - "ubidict-py/**"
      - ".github/workflows/ubidict-py-ci.yml"
  pull_request:
    paths:
      - "ubidict-py/**"
      - ".github/workflows/ubidict-py-ci.yml"

defaults:
  run:
    working-directory: ubidict-py

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ubidict-py/pyproject.toml

      - name: Install (with dev extras)
        run: pip install -e ".[dev]"

      # 실제 버그를 잡는 규칙만 본다(E4/E7/E9/F) — pyproject.toml [tool.ruff.lint]
      # 참고. test/에서 그대로 포팅한 코드의 스타일까지 강제로 안 뜯어고친다.
      - name: Lint (ruff)
        run: ruff check .

      # Gemini·SQS·MySQL을 실제로 부르는 테스트는 없다(비용·비결정성 때문에
      # 의도적으로 뺐다 — tests/test_main.py 상단 주석 참고). 그건 사람이
      # 실제 인프라로 수동 검증했다(task.md, 2026-09-13 실제 SQS E2E 기록).
      - name: Test (pytest)
        run: pytest tests/ -v
