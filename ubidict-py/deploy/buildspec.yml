# CodeBuild 템플릿(선택) — ECR 로그인·이미지 빌드·푸시 + imagedefinitions.json
# 생성까지. CI 파이프라인이 CodeBuild가 아니라면 이 파일은 참고만 하고
# 실제 CI 도구에 맞게 새로 작성한다 — 아직 확정 아님(task.md 참고).
version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "ubidict-py"
    CONTAINER_NAME: "ubidict-py"

phases:
  pre_build:
    commands:
      - echo "ECR 로그인"
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
  build:
    commands:
      - echo "빌드: $IMAGE_REPO_NAME:$IMAGE_TAG"
      - cd ubidict-py
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
  post_build:
    commands:
      - echo "ECR 푸시"
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - ubidict-py/imagedefinitions.json
    - ubidict-py/deploy/appspec.yaml
    - ubidict-py/deploy/taskdef.json
