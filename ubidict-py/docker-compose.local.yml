# 로컬 전용 개발/테스트 인프라 — 실제 AWS/백엔드 없이 큐 흐름(SQS→처리→SQS)을
# 로컬에서 검증하기 위한 것. 프로덕션 배포와는 무관하다(그건 deploy/ 참고).
#
# MySQL은 여기 없다 — final/backend의 compose.yaml이 띄우는 MySQL을 그대로
# 쓴다(2026-09-14부터, app/backend_db.py가 그 DB의 document/term 테이블을
# 직접 읽어야 해서 별도 인스턴스를 둘 이유가 없어졌다). backend 리포에서
# `docker compose up -d mysql`로 띄우고, 포트는 `docker port backend-mysql-1`로
# 확인해 `.env`의 MYSQL_PORT에 넣는다.
#
# 사용법(이 compose는 SQS만 흉내낸다):
#   docker compose -f docker-compose.local.yml up -d
#   python scripts/init_local_queues.py          # 큐 2개 생성, .env에 넣을 URL 출력
#   python scripts/stub_backend.py --type extract  # 가짜 백엔드로 요청 보내고 응답 확인
services:
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=ap-northeast-2
    volumes:
      - localstack_data:/var/lib/localstack

volumes:
  localstack_data:
